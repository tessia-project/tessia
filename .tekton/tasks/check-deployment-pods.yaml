apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-deployment-pods
spec:
  params:
    - name: IMAGE_TAG
      type: string
      description: Image tag to deploy
  description: Check whether all the deployment pods are up and reachable
  steps:
    - computeResources: {}
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      name: check-resources
      script: |
        #!/usr/bin/bash
        set -e

        NS="tessia"
        SERVER_DEPLOY="tessia-server-$(params.IMAGE_TAG)"
        MEDIATOR_DEPLOY="tessia-mediator-$(params.IMAGE_TAG)"
        DB_STS="tessia-db-$(params.IMAGE_TAG)"

        # -------------------------------------------------------------------
        # dump_pod_logs: current + previous container logs and pod describe
        #   Usage: dump_pod_logs <label>
        # -------------------------------------------------------------------
        dump_pod_logs() {
          local label="$1"
          local pod
          pod=$(oc get pods -n "$NS" -l "$label" \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          [ -z "$pod" ] && return
          echo "--- current logs: $pod ---"
          oc logs -n "$NS" "$pod" -c tessia-server 2>/dev/null || true
          echo "--- previous logs: $pod ---"
          oc logs -n "$NS" "$pod" -c tessia-server --previous 2>/dev/null || true
          echo "--- describe pod: $pod ---"
          oc describe pod -n "$NS" "$pod" || true
        }

        # -------------------------------------------------------------------
        # debug_pods: describe all matching pods + recent namespace events
        #   Usage: debug_pods <label>
        # -------------------------------------------------------------------
        debug_pods() {
          local label="$1"
          echo "--- pods for label $label ---"
          oc get pods -n "$NS" -l "$label" -o wide || true
          echo "--- describe pods for label $label ---"
          oc describe pods -n "$NS" -l "$label" || true
          echo "--- recent events in namespace $NS ---"
          oc get events -n "$NS" --sort-by='.lastTimestamp' | tail -40 || true
        }

        # -------------------------------------------------------------------
        # wait_for_available: poll a Deployment/StatefulSet until ready
        #   Usage: wait_for_available <kind> <name> <label> [timeout_seconds]
        # -------------------------------------------------------------------
        wait_for_available() {
          local kind="$1"   # deployment | statefulset
          local name="$2"
          local label="$3"
          local timeout="${4:-180}"
          local interval=10
          local elapsed=0
          local available

          echo "Waiting for $kind/$name to become available (timeout: ${timeout}s)..."

          while true; do
            if [ "$kind" = "statefulset" ]; then
              available=$(oc get statefulset "$name" -n "$NS" \
                -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            else
              available=$(oc get deployment "$name" -n "$NS" \
                -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo "0")
            fi

            echo "[${elapsed}s] $name availableReplicas=${available:-0}"

            [ "${available:-0}" -ge 1 ] && return 0

            if [ "$elapsed" -ge "$timeout" ]; then
              echo "ERROR: $name did not become available within ${timeout}s."
              dump_pod_logs "$label"
              debug_pods "$label"
              return 1
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done
        }

        # -------------------------------------------------------------------
        # Check each component in dependency order:
        #   DB must be ready before server can run migrations,
        #   server must be ready before mediator work is meaningful.
        # -------------------------------------------------------------------
        wait_for_available statefulset "$DB_STS"       "app=${DB_STS}"       180
        wait_for_available deployment  "$SERVER_DEPLOY" "app=${SERVER_DEPLOY}" 480
        wait_for_available deployment  "$MEDIATOR_DEPLOY" "app=${MEDIATOR_DEPLOY}" 180

        echo "All deployments are available."

  workspaces:
    - name: source
